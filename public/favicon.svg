<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base background with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Subtle corner signal dot -->
  <circle cx="51" cy="13" r="3" fill="url(#tealGrad)" />

  <!-- BM Monogram -->
  <g filter="url(#glow)">
    <text x="32" y="42" 
          font-family="system-ui, -apple-system, 'Space Grotesk', 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="800" 
          letter-spacing="-1.5" 
          text-anchor="middle">
      <tspan fill="#f8fafc">B</tspan><tspan fill="url(#tealGrad)">M</tspan>
    </text>
  </g>
</svg>
